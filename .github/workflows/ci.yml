name: GOSHMAN CI

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: goshman-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Download verified official Blender 5.2.3 LTS
        run: |
          curl --fail --location --silent --show-error https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz --output blender-5.2.3-linux-x64.tar.xz
          curl --fail --location --silent --show-error https://download.blender.org/release/Blender5.2/blender-5.2.3.sha256 --output blender-5.2.3.sha256
          grep 'blender-5.2.3-linux-x64.tar.xz' blender-5.2.3.sha256 > blender-linux.sha256
          sha256sum --check blender-linux.sha256
          mkdir blender-runtime
          tar -xJf blender-5.2.3-linux-x64.tar.xz -C blender-runtime
      - name: Generate actual Blender model
        run: |
          python -m goshman.cli new ci_project
          python -c "import json; from pathlib import Path; p=Path('ci_project/project.json'); d=json.loads(p.read_text()); d['spec']['height']=7.44; d['spec']['tail_length']=3.6; p.write_text(json.dumps(d))"
          blender-runtime/blender-5.2.3-linux-x64/blender --background --factory-startup --python-exit-code 31 --python goshman/blender_generate.py -- --project ci_project --render 0 --export 1 --pbr-resolution 256
          test -s ci_project/output/crocodile_cowboy.blend
          test -s ci_project/output/crocodile_cowboy.glb
          test -s ci_project/output/crocodile_cowboy.fbx
          test -s ci_project/output/preview_front.png
          test -s ci_project/output/pbr_manifest.json
          test "$(find ci_project/output/pbr -type f -name '*.png' | wc -l)" -eq 40
          python -c "from PIL import Image,ImageStat; from pathlib import Path; root=Path('ci_project/output/pbr'); a=Image.open(root/'scales_base_color.png').convert('RGB'); b=Image.open(root/'belly_base_color.png').convert('RGB'); n=Image.open(root/'scales_normal.png').convert('RGB'); r=Image.open(root/'scales_roughness.png').convert('RGB'); am=ImageStat.Stat(a).mean; bm=ImageStat.Stat(b).mean; nm=ImageStat.Stat(n).mean; rm=ImageStat.Stat(r).mean; assert am[1]>35 and am[1]>am[0] and am[1]>am[2],am; assert bm[0]>70 and bm[1]>50,bm; assert nm[2]>190,nm; assert 60<rm[0]<240,rm; print('PBR NONBLACK REAL PIXEL PASS',am,bm,nm,rm)"

          python -c "import json; from pathlib import Path; d=json.loads(Path('ci_project/output/pbr_manifest.json').read_text()); assert d['resolution']==256; assert len(d['materials'])==10; assert all(len(v)==4 for v in d['materials'].values())"
          python -c "from PIL import Image; im=Image.open('ci_project/output/preview_front.png'); assert im.mode=='RGBA'; assert im.size==(384,384); im.verify()"
          python -c "import json; from pathlib import Path; d=json.loads(Path('ci_project/output/build_report.json').read_text()); assert d['mesh_objects']>=170; assert d['bones']>=39; assert d['actions']>=25; assert abs(d['overall_scale']-1.2)<.0001; assert abs(d['tail_tip_y']-3.69)<.001, d"
          python -c "import json,struct; from pathlib import Path; b=Path('ci_project/output/crocodile_cowboy.glb').read_bytes(); assert b[:4]==b'glTF'; n=struct.unpack_from('<I',b,12)[0]; doc=json.loads(b[20:20+n]); assert len(doc.get('animations',[]))>=25, len(doc.get('animations',[])); assert len(doc.get('images',[]))>=10, len(doc.get('images',[])); assert any('normalTexture' in m for m in doc.get('materials',[])), 'normal maps absent'"
      - name: Verify imported GLB converts into editable Blender master project
        run: |
          blender-runtime/blender-5.2.3-linux-x64/blender --background --factory-startup --python-exit-code 31 --python goshman/blender_import_ai.py -- --source ci_project/output/crocodile_cowboy.glb --destination ci_project/output/imported_character.blend --height 6.2
          test -s ci_project/output/imported_character.blend
          python -c "import json; from pathlib import Path; d=json.loads(Path('ci_project/output/imported_character.json').read_text()); assert d['mesh_objects']>=150 and d['faces']>1000; assert not d['visual_fidelity_verified']"
      - name: Bake actual high-poly detail onto low-poly UVs with Cycles CPU
        run: |
          mkdir -p ci_project/output/cycles_bake_test
          blender-runtime/blender-5.2.3-linux-x64/blender --background --factory-startup --python-exit-code 31 --python scripts/ci_blender_bake.py -- ci_project/output/cycles_bake_test
          test -s ci_project/output/cycles_bake_test/normal.png
          test -s ci_project/output/cycles_bake_test/roughness.png
          test -s ci_project/output/cycles_bake_test/metallic.png
          test -s ci_project/output/cycles_bake_test/base_color.png
          python -c "import json; from pathlib import Path; r=json.loads(Path('ci_project/output/cycles_bake_test/bake_report.json').read_text()); assert r['method']=='selected_to_active' and r['source_faces']>r['target_faces']*5"

      - name: Render five actual GLB views for visual acceptance
        run: |
          blender-runtime/blender-5.2.3-linux-x64/blender --background --factory-startup --python-exit-code 31 --python goshman/blender_render_views.py -- --model ci_project/output/crocodile_cowboy.glb --output ci_project/output/qa_views --width 128 --height 256 --samples 1
          python -c "from pathlib import Path; import json; p=Path('ci_project/output/qa_views'); d=json.loads((p/'render_manifest.json').read_text()); assert d['status']=='PASS_RENDER_TECHNICAL'; assert set(d['views'])=={'front','left','back','right','three_quarter'}; assert all((p/(r+'.png')).stat().st_size>100 for r in d['views'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goshman-blender-output
          path: ci_project/output/
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package and packaging tools
        run: python -m pip install -e '.[gui,ai,test]' pyinstaller
      - name: Unit tests
        run: python -m pytest -q
      - name: Verify Qt desktop startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtCore import QTimer; from PySide6.QtWidgets import QApplication; from goshman.gui import Window; app=QApplication([]); w=Window(); QTimer.singleShot(500,app.quit); app.exec()"
      - name: Build Windows folder application
        run: pyinstaller --noconfirm --clean --windowed --name GOSHMAN --collect-all PySide6 --collect-all pydantic --collect-submodules openai --collect-submodules keyring --add-data "goshman/blender_generate.py;goshman" --add-data "goshman/pbr_blender.py;goshman" --add-data "goshman/pbr_maps.py;goshman" --add-data "goshman/blender_import_ai.py;goshman" --add-data "goshman/blender_bake.py;goshman" --add-data "goshman/blender_render_views.py;goshman" goshman_app.py
      - name: Smoke-test packaged Windows EXE
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\\dist\\GOSHMAN\\GOSHMAN.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Write-Output "Packaged executable exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Packaged GOSHMAN.exe failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: goshman-windows-2022
          path: dist/GOSHMAN/
          if-no-files-found: error
