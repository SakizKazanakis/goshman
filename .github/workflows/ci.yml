name: GOSHMAN CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Download verified official Blender 5.2.3 LTS
        run: |
          curl --fail --location --silent --show-error https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz --output blender-5.2.3-linux-x64.tar.xz
          curl --fail --location --silent --show-error https://download.blender.org/release/Blender5.2/blender-5.2.3.sha256 --output blender-5.2.3.sha256
          grep 'blender-5.2.3-linux-x64.tar.xz' blender-5.2.3.sha256 > blender-linux.sha256
          sha256sum --check blender-linux.sha256
          mkdir blender-runtime
          tar -xJf blender-5.2.3-linux-x64.tar.xz -C blender-runtime
      - name: Generate actual Blender model
        run: |
          python -m goshman.cli new ci_project
          blender-runtime/blender-5.2.3-linux-x64/blender --background --factory-startup --python-exit-code 31 --python goshman/blender_generate.py -- --project ci_project --render 0 --export 1
          test -s ci_project/output/crocodile_cowboy.blend
          test -s ci_project/output/crocodile_cowboy.glb
          test -s ci_project/output/crocodile_cowboy.fbx
          test -s ci_project/output/preview_front.png
          python -c "from PIL import Image; im=Image.open('ci_project/output/preview_front.png'); assert im.mode=='RGBA'; assert im.size==(384,384); im.verify()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goshman-blender-output
          path: ci_project/output/
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package and packaging tools
        run: python -m pip install -e '.[gui,ai,test]' pyinstaller
      - name: Unit tests
        run: python -m pytest -q
      - name: Verify Qt desktop startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtCore import QTimer; from PySide6.QtWidgets import QApplication; from goshman.gui import Window; app=QApplication([]); w=Window(); QTimer.singleShot(500,app.quit); app.exec()"
      - name: Build Windows folder application
        run: pyinstaller --noconfirm --clean --windowed --name GOSHMAN --collect-all PySide6 --collect-all pydantic --collect-submodules openai --collect-submodules keyring --add-data "goshman/blender_generate.py;goshman" goshman_app.py
      - name: Smoke-test packaged Windows EXE
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\\dist\\GOSHMAN\\GOSHMAN.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Write-Output "Packaged executable exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Packaged GOSHMAN.exe failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: goshman-windows-2022
          path: dist/GOSHMAN/
          if-no-files-found: error
