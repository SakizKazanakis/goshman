[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goshman"
version = "0.1.0a0"
description = "Reference-driven animatronic 3D asset production for Clickteam Fusion"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "GOSHMAN contributors"}]
dependencies = ["Pillow>=10,<13", "pydantic>=2,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
ai = ["openai>=2,<4", "keyring>=25,<27"]
test = ["pytest>=8,<10", "trimesh>=4,<6", "numpy>=2,<3"]
vision = ["numpy>=2,<3", "scipy>=1.12,<2", "scikit-image>=0.24,<1", "opencv-python-headless>=4.9,<5", "trimesh>=4,<6"]

[project.scripts]
goshman = "goshman.cli:main"
goshman-gui = "goshman.gui:main"

[tool.setuptools.packages.find]
include = ["goshman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
